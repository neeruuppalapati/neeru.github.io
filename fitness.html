<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness Log</title>
  <link rel="stylesheet" type="text/css" href="css/main.css">
</head>
<body>
  <!-- Placeholder for Header Component -->
  <div id="header"></div>

  <!-- Page Title -->
  <h1 class="page-title">Fitness Log</h1>

  <!-- Fitness Log Table -->
  <div class="fitness-log">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Activity</th>
          <th>Duration</th>
        </tr>
      </thead>
      <tbody>
        <!-- To add an entry, copy one <tr>...</tr> block and fill it in. -->
        <tr>
          <td>9/4</td>
          <td>5 mile run</td>
          <td>40 minutes</td>
        </tr>
        <tr>
          <td>9/4</td>
          <td>Climb</td>
          <td>2 hours</td>
        </tr>
        <tr>
          <td>9/5</td>
          <td>4 mile run</td>
          <td>45 minutes</td>
        </tr>
        <tr>
          <td>9/8</td>
          <td>Climb</td>
          <td>2 hours</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- JavaScript Module -->
  <script src="js/main.js" type="module"></script>
</body>
</html>
