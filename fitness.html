<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness Log</title>
  <link rel="stylesheet" type="text/css" href="css/main.css">
</head>
<body>
  <!-- Placeholder for Header Component -->
  <div id="header"></div>

  <!-- Page Title -->
  <h1 class="page-title">Fitness Log</h1>

  <!-- Fitness Log Table -->
  <div class="fitness-log">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Activity</th>
          <th>Duration</th>
        </tr>
      </thead>
      <!-- Rows are filled in by js/fitness.js from the list in js/fitness-entries.js -->
      <tbody id="fitness-body">
        <noscript><tr><td colspan="3">Enable JavaScript to see the log.</td></tr></noscript>
      </tbody>
    </table>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/main.js" type="module"></script>
  <script src="js/fitness.js" type="module"></script>
</body>
</html>
